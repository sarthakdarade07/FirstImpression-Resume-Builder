spring.application.name=backend


# ------------------------------------------------------------------------------
# 1. MySQL Database Configuration
# ------------------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ------------------------------------------------------------------------------
# 2. JWT (JSON Web Token) Configuration
# ------------------------------------------------------------------------------

jwt.secret=${JWT_SECRET:${JWT_SCRET}}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ------------------------------------------------------------------------------
# 3. Cloudinary Configuration (Profile Image Uploads)
# ------------------------------------------------------------------------------

cloudinary.cloud.name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET:${CLOUDINARY_SECREAT}}

# ------------------------------------------------------------------------------
# 4. Email / SMTP Configuration (Spring Mail)
# ------------------------------------------------------------------------------

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.from=${MAIL_FROM:firstimpression7070@gmail.com}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

# ------------------------------------------------------------------------------
# 5. Server & Application Settings (Optional Overrides)
# ------------------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
app.base.url=${BASE_URL:http://localhost:8080}
FRONTEND_BASE_URL=${FRONTEND_BASE_URL:http://localhost:5173}

#--------------------AI Provider Config (gemini or grok)-------------------
 
ai.provider=${AI_PROVIDER:gemini}
gemini.api.key=${GEMINI_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

grok.api.key=${GROK_API_KEY:}
grok.model=${GROK_MODEL:grok-2-latest}
grok.api.url=${GROK_API_URL:https://api.x.ai/v1}

# File Upload Limit
spring.servlet.multipart.max-file-size=${FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FILE_SIZE:10MB}
