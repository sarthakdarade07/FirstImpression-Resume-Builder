spring.application.name=backend

spring.config.import=optional:file:./application-secrets.properties,optional:file:./backend/application-secrets.properties,optional:classpath:application-secrets.properties


#-------------------Mysql---------------------

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#--------------------Email------------------------------

spring.mail.properties.mail.smtp.auth= true
spring.mail.properties.mail.smtp.starttls.enable = true
spring.mail.protocol=smtp

#App
app.base.url = http://localhost:8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#--------------------AI Provider Config (gemini or grok)-------------------
ai.provider=${AI_PROVIDER:gemini}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Grok (xAI)
grok.api.key=${GROK_API_KEY:}
grok.model=${GROK_MODEL:grok-2-latest}
grok.api.url=${GROK_API_URL:https://api.x.ai/v1/chat/completions}